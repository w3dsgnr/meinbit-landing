# MeinBit landing — nginx server block (static SPA)
#
# Build first:   npm ci && npm run build
# Then copy the contents of dist/ to /var/www/meinbit (root below).
#
# Place this file at /etc/nginx/sites-available/meinbit and symlink it into
# sites-enabled, then:  nginx -t && systemctl reload nginx

server {
    listen 80;
    listen [::]:80;
    server_name meinbit.io www.meinbit.io;

    # --- TLS ---------------------------------------------------------------
    # Recommended: obtain a certificate with certbot, which will add a 443
    # server block and redirect 80 -> 443 automatically:
    #   certbot --nginx -d meinbit.io -d www.meinbit.io
    # -----------------------------------------------------------------------

    root /var/www/meinbit;
    index index.html;

    # Hashed build assets (JS/CSS/img) are immutable — cache hard.
    location /assets/ {
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Static media in public/ (videos, logos, etc.).
    location ~* \.(?:mp4|webm|png|jpg|jpeg|svg|webp|ico|woff2?)$ {
        access_log off;
        expires 30d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # SPA fallback: every unknown path is served by index.html so that
    # client-side routes (/privacy-policy, /terms-of-service, ...) work on
    # direct load and refresh. index.html itself must NOT be cached.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }

    # Light hardening.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/json;
    gzip_min_length 1024;
}
